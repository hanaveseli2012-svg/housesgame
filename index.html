<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HOUSES — Space Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--glow-speedster:#ff3333;--glow-hipster:#cc44ff;--glow-engineer:#33ff66;--glow-shadow:#3399ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;overflow:hidden;font-family:'Orbitron',sans-serif;background:#000;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;}

/* SCREENS */
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;}
.screen.active{display:flex;}

/* CHARACTER SELECT */
.title{font-size:clamp(1.4rem,4vw,2.4rem);font-weight:900;text-transform:uppercase;letter-spacing:.2em;text-align:center;text-shadow:0 0 15px rgba(255,255,255,.8),0 0 40px rgba(100,180,255,.5);margin-bottom:.3rem;}
.subtitle{font-size:.7rem;color:rgba(255,255,255,.5);letter-spacing:.3em;margin-bottom:1.5rem;}
.card-grid{display:flex;gap:clamp(.6rem,2.5vw,1.8rem);flex-wrap:wrap;justify-content:center;}
.char-card{width:clamp(110px,16vw,170px);aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:all .3s ease;background:rgba(10,10,30,.5);position:relative;}
.char-card img{width:100%;height:100%;object-fit:cover;filter:brightness(.75);transition:all .3s ease;}
.char-card:nth-child(1){--glow:var(--glow-speedster);}.char-card:nth-child(2){--glow:var(--glow-hipster);}.char-card:nth-child(3){--glow:var(--glow-engineer);}.char-card:nth-child(4){--glow:var(--glow-shadow);}
.char-card:hover{transform:translateY(-8px) scale(1.05);border-color:var(--glow);box-shadow:0 0 25px var(--glow);}
.char-card:hover img{filter:brightness(1);}
.char-card .label{position:absolute;bottom:0;left:0;right:0;padding:.4rem;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .3s;}
.char-card:hover .label,.char-card.selected .label{opacity:1;}
.char-card.selected{border-color:#fff!important;box-shadow:0 0 35px #fff,0 0 80px var(--glow)!important;transform:translateY(-12px) scale(1.08);animation:selPulse 1.5s ease-in-out infinite;}
.char-card.dimmed{opacity:.3;transform:scale(.85);}
@keyframes selPulse{0%,100%{box-shadow:0 0 35px #fff,0 0 80px var(--glow)}50%{box-shadow:0 0 55px #fff,0 0 120px var(--glow)}}
.btn{font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;padding:.7rem 2rem;border:2px solid rgba(255,255,255,.3);border-radius:50px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);cursor:not-allowed;transition:all .3s;pointer-events:none;margin-top:1.5rem;}
.btn.active{border-color:#fff;color:#fff;cursor:pointer;pointer-events:auto;box-shadow:0 0 25px rgba(100,180,255,.3);}
.btn.active:hover{background:rgba(255,255,255,.15);transform:scale(1.05);}

/* HUD */
#hud{position:fixed;top:.5rem;left:.5rem;right:.5rem;z-index:30;display:none;justify-content:space-between;align-items:center;padding:.3rem .8rem;pointer-events:none;}
#hud.active{display:flex;}
.hud-item{background:rgba(0,0,0,.55);border-radius:20px;padding:.3rem .8rem;font-size:.65rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(255,255,255,.12);}

/* GAME OVER */
.gameover{background:rgba(5,5,20,.93);border-radius:18px;padding:2rem;text-align:center;border:2px solid rgba(255,255,255,.2);max-width:380px;width:90%;}
.gameover h2{color:#ff5555;font-size:1.5rem;margin-bottom:.5rem;}
.gameover .stat{font-size:.7rem;color:rgba(255,255,255,.55);margin:.25rem 0;}
.gameover .stat span{color:#ffd700;font-weight:700;}
.gameover .btn{margin-top:1rem;}

/* AUDIO */
.audio-btn{position:fixed;top:.8rem;right:.8rem;z-index:50;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;}
.audio-btn:hover{border-color:#fff;}
.audio-btn.muted{opacity:.5;}

canvas{display:block;position:absolute;top:0;left:0;z-index:10;}

@media(max-width:768px){.char-card{width:clamp(90px,35vw,140px);border-radius:12px;}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<button class="audio-btn" id="audioBtn" title="Music">🔊</button>

<!-- SCREEN: Character Select -->
<div class="screen active" id="screenChar">
  <h1 class="title">Choose Your Runner</h1>
  <p class="subtitle">Pick a character</p>
  <div class="card-grid" id="charGrid">
    <div class="char-card" data-char="speedster"><img src="assets/character-1.jpg" draggable="false"><div class="label">Speedster</div></div>
    <div class="char-card" data-char="hipster"><img src="assets/character-2.jpg" draggable="false"><div class="label">Hipster</div></div>
    <div class="char-card" data-char="engineer"><img src="assets/character-3.jpg" draggable="false"><div class="label">Engineer</div></div>
    <div class="char-card" data-char="shadow"><img src="assets/character-4.jpg" draggable="false"><div class="label">Shadow</div></div>
  </div>
  <button class="btn" id="btnStart" disabled>Start Running</button>
</div>

<!-- SCREEN: Game Over -->
<div class="screen" id="screenOver">
  <div class="gameover">
    <h2>💀 Wiped Out!</h2>
    <p class="stat">Score: <span id="goScore">0</span></p>
    <p class="stat">Coins: <span id="goCoins">0</span></p>
    <p class="stat">Distance: <span id="goDist">0</span>m</p>
    <button class="btn active" id="btnRetry" style="pointer-events:auto;cursor:pointer;">🔄 Run Again</button>
    <button class="btn active" id="btnNewChar" style="pointer-events:auto;cursor:pointer;margin-left:.5rem;">👤 New Character</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-item">🪙 <span id="hCoins">0</span></div>
  <div class="hud-item">🏃 <span id="hDist">0</span>m</div>
  <div class="hud-item">♥ <span id="hLives">3</span></div>
</div>

<audio id="bgm" loop preload="auto"><source src="assets/galactic-velocity-rush.mp3" type="audio/mpeg"></audio>

<script>
// ═══════════════ CANVAS ═══════════════
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;

function rs(){W=C.width=innerWidth;H=C.height=innerHeight;}
rs();window.addEventListener('resize',rs);

// ═══════════════ AUDIO ═══════════════
const bgm=document.getElementById('bgm'),aBtn=document.getElementById('audioBtn');
let muted=false;
function playBgm(){bgm.volume=.35;bgm.play().catch(()=>{muted=true;aBtn.textContent='🔇';aBtn.classList.add('muted');});}
aBtn.onclick=()=>{if(muted){bgm.play();muted=false;aBtn.textContent='🔊';aBtn.classList.remove('muted');}else{bgm.pause();muted=true;aBtn.textContent='🔇';aBtn.classList.add('muted');}};
document.addEventListener('click',playBgm,{once:true});

// ═══════════════ STATE ═══════════════
const chars={speedster:{color:'#ff3333',img:null},hipster:{color:'#cc44ff',img:null},engineer:{color:'#33ff66',img:null},shadow:{color:'#3399ff',img:null}};
const charPaths={speedster:'assets/character-1.jpg',hipster:'assets/character-2.jpg',engineer:'assets/character-3.jpg',shadow:'assets/character-4.jpg'};
let selectedChar=null,charImg=null;
let playing=false,score=0,coins=0,distance=0,lives=3,speed=6;
let lane=1; // 0=left, 1=center, 2=right
let playerY=0,playerTargetY=0,playerVY=0,jumping=false,slideTimer=0;
let obstacles=[],coinItems=[],stars=[],groundOffset=0;
let frame=0;

// Load images
for(const[k,v] of Object.entries(chars)){v.img=new Image();v.img.src=charPaths[k];}

// ═══════════════ CHARACTER SELECT ═══════════════
const charCards=document.querySelectorAll('.char-card'),btnStart=document.getElementById('btnStart');
charCards.forEach(c=>{c.onclick=()=>{charCards.forEach(x=>{x.classList.remove('selected');x.classList.add('dimmed');});c.classList.remove('dimmed');c.classList.add('selected');selectedChar=c.dataset.char;btnStart.classList.add('active');btnStart.disabled=false;btnStart.textContent='Start Running — '+c.querySelector('.label').textContent;};});
btnStart.onclick=()=>{if(!selectedChar)return;startGame();};

// ═══════════════ START ═══════════════
function startGame(){
  charImg=chars[selectedChar].img;
  score=0;coins=0;distance=0;lives=3;speed=6;lane=1;playerY=0;playerTargetY=0;playerVY=0;jumping=false;slideTimer=0;obstacles=[];coinItems=[];stars=[];groundOffset=0;frame=0;
  initStars();
  document.getElementById('screenChar').classList.remove('active');
  document.getElementById('screenOver').classList.remove('active');
  document.getElementById('hud').classList.add('active');
  playing=true;
  updateHUD();
  loop();
}

function initStars(){stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.7,r:Math.random()*1.8+.3,s:Math.random()*1.5+.3,o:Math.random()});}

// ═══════════════ GAME LOOP ═══════════════
function loop(){
  if(!playing){requestAnimationFrame(loop);return;}
  frame++;
  update();
  render();
  requestAnimationFrame(loop);
}

// ═══════════════ UPDATE ═══════════════
function update(){
  // Speed ramp
  speed=6+distance/80;
  if(speed>22)speed=22;

  // Ground scroll
  groundOffset=(groundOffset+speed)%80;

  // Player lane target
  const laneX=[W*.2,W*.5,W*.8];
  playerTargetY=laneX[lane];

  // Smooth lane transition
  const laneSpeed=.15;
  playerY+=(playerTargetY-playerY)*laneSpeed;

  // Jump physics
  if(jumping){
    playerVY+=.6;
    if(playerVY>0&&slideTimer<=0){
      jumping=false;playerVY=0;
    }
  }

  // Slide timer
  if(slideTimer>0)slideTimer--;

  // Stars
  for(const s of stars){s.y+=s.s;if(s.y>H*.7){s.y=-5;s.x=Math.random()*W;}}

  // Spawn obstacles
  if(frame%Math.max(25,70-speed*2)===0){
    const types=['barrier','tall','single','single'];
    const type=types[Math.floor(Math.random()*types.length)];
    const l=type==='single'?Math.floor(Math.random()*3):-1;
    obstacles.push({
      x:W+20,y:laneX[l>=0?l:1],
      type,lane:l,
      w:type==='tall'?30:28,
      h:type==='tall'?75:type==='barrier'?38:50,
      jumpable:type==='barrier',
      slideable:type==='tall',
    });
  }

  // Move obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    obstacles[i].x-=speed;
    if(obstacles[i].x<-60)obstacles.splice(i,1);
  }

  // Spawn coins
  if(frame%18===0){
    const cl=laneX[Math.floor(Math.random()*3)];
    coinItems.push({x:W+20,y:cl-20-(Math.random()*60),collected:false,r:8});
  }

  // Move coins
  for(let i=coinItems.length-1;i>=0;i--){
    coinItems[i].x-=speed;
    if(coinItems[i].x<-20)coinItems.splice(i,1);
  }

  // Collision detection
  const px=playerY,py=H*.72+(jumping?playerVY*8:0)-(slideTimer>0?25:0);
  const pw=charImg?40:30,ph=charImg?70:50;

  for(const o of obstacles){
    const ox=o.x,oy=(o.lane>=0?laneX[o.lane]:o.y)-o.h/2;
    if(ox-pw/2<px+pw/2&&ox+o.w/2>px-pw/2){
      const playerTop=py-ph/2,playerBot=py+ph/2;
      const obsTop=oy-o.h/2,obsBot=oy+o.h/2;
      if(playerBot>obsTop+5&&playerTop<obsBot-5){
        if(o.jumpable&&jumping&&playerVY<-2)continue; // jumped over
        if(o.slideable&&slideTimer>0)continue; // slid under
        if(o.lane>=0&&Math.abs(lane-o.lane)<.5)continue; // different lane for single
        hitPlayer();
        break;
      }
    }
  }

  // Coin collection
  for(const c of coinItems){
    if(c.collected)continue;
    const dx=px-c.x,dy=py-c.y;
    if(Math.sqrt(dx*dx+dy*dy)<40){c.collected=true;coins++;score+=10;}
  }

  // Distance
  distance+=speed*.05;
  score=Math.floor(distance*2)+coins*10;

  updateHUD();
}

function hitPlayer(){
  lives--;
  updateHUD();
  if(lives<=0){gameOver();return;}
  // Flash + brief invuln
  for(let i=obstacles.length-1;i>=0;i--){
    if(obstacles[i].x<playerY+80&&obstacles[i].x>playerY-80)obstacles.splice(i,1);
  }
}

function gameOver(){
  playing=false;
  document.getElementById('hud').classList.remove('active');
  document.getElementById('goScore').textContent=score;
  document.getElementById('goCoins').textContent=coins;
  document.getElementById('goDist').textContent=Math.floor(distance);
  document.getElementById('screenOver').classList.add('active');
}

function updateHUD(){
  document.getElementById('hCoins').textContent=coins;
  document.getElementById('hDist').textContent=Math.floor(distance);
  document.getElementById('hLives').textContent=lives;
}

// ═══════════════ RENDER ═══════════════
function render(){
  // Sky
  const gd=X.createLinearGradient(0,0,0,H*.7);
  gd.addColorStop(0,'#000020');gd.addColorStop(.5,'#0a0a40');gd.addColorStop(1,'#101040');
  X.fillStyle=gd;X.fillRect(0,0,W,H*.7);

  // Stars
  for(const s of stars){
    X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);
    X.fillStyle=`rgba(200,220,255,${s.o})`;X.fill();
  }

  // Ground
  X.fillStyle='#1a1040';
  X.fillRect(0,H*.7,W,H*.3);
  // Ground line
  X.strokeStyle='rgba(100,180,255,.3)';X.lineWidth=2;
  X.beginPath();X.moveTo(0,H*.7);X.lineTo(W,H*.7);X.stroke();
  // Ground dashes
  X.strokeStyle='rgba(100,180,255,.15)';X.lineWidth=1;
  for(let x=-groundOffset;x<W+80;x+=80){
    X.beginPath();X.moveTo(x,H*.72);X.lineTo(x+30,H*.72);X.stroke();
  }

  // Lane markers
  for(let l=0;l<3;l++){
    const lx=laneX[l];
    X.strokeStyle='rgba(255,255,255,.08)';X.lineWidth=1;
    X.setLineDash([10,20]);X.beginPath();X.moveTo(lx,H*.7);X.lineTo(lx,H);X.stroke();X.setLineDash([]);
  }

  // Draw obstacles
  for(const o of obstacles){
    const ox=o.x,oy=(o.lane>=0?laneX[o.lane]:o.y);
    X.fillStyle=o.slideable?'rgba(255,120,30,.85)':'rgba(255,50,50,.8)';
    X.fillRect(ox-o.w/2,oy-o.h/2,o.w,o.h);
    X.strokeStyle='#fff';X.lineWidth=1.5;
    X.strokeRect(ox-o.w/2,oy-o.h/2,o.w,o.h);
    // Icon
    X.fillStyle='#fff';X.font='12px sans-serif';X.textAlign='center';
    X.fillText(o.slideable?'⬇':'⬆',ox,oy);
  }

  // Draw coins
  for(const c of coinItems){
    if(c.collected)continue;
    const t=frame*.05;
    X.beginPath();X.arc(c.x,c.y+Math.sin(t+c.x)*3,c.r,0,Math.PI*2);
    X.fillStyle='#ffd700';X.fill();
    X.strokeStyle='#b8860b';X.lineWidth=1;X.stroke();
  }

  // Draw player
  const px=playerY,py=H*.72+(jumping?playerVY*8:0);
  const isSliding=slideTimer>0;
  const dw=isSliding?55:40,dh=isSliding?35:70;

  // Shadow
  X.beginPath();X.ellipse(px,H*.74,20,4,0,0,Math.PI*2);
  X.fillStyle='rgba(0,0,0,.3)';X.fill();

  if(charImg&&charImg.complete&&charImg.naturalWidth>0){
    X.save();
    if(isSliding){
      X.translate(px,py-5);X.rotate(-.1);
      X.drawImage(charImg,-dw/2,-dh/2,dw,dh);
    }else{
      X.drawImage(charImg,px-dw/2,py-dh/2,dw,dh);
    }
    X.restore();
    // Glow
    X.beginPath();X.arc(px,py-dh/2+dh*.4,dw*.6,0,Math.PI*2);
    X.fillStyle=chars[selectedChar].color+'33';X.fill();
  }else{
    X.fillStyle=chars[selectedChar].color;
    X.fillRect(px-dw/2,py-dh/2,dw,dh);
  }

  // Name
  if(selectedChar){
    X.fillStyle='#fff';X.font='bold 8px Orbitron,sans-serif';X.textAlign='center';
    X.fillText(selectedChar.charAt(0).toUpperCase()+selectedChar.slice(1),px,py-dh/2-8);
  }

  // Invulnerability flash
  if(lives<3&&frame%10<5){
    X.fillStyle='rgba(255,255,255,.08)';X.fillRect(0,0,W,H);
  }
}

// ═══════════════ CONTROLS ═══════════════
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(!playing)return;
  if(e.key==='ArrowLeft'||e.key==='a')lane=Math.max(0,lane-1);
  if(e.key==='ArrowRight'||e.key==='d')lane=Math.min(2,lane+1);
  if((e.key==='ArrowUp'||e.key==='w'||e.key===' ')&&!jumping&&slideTimer<=0){jumping=true;playerVY=-9;}
  if((e.key==='ArrowDown'||e.key==='s')&&!jumping){slideTimer=18;}
  e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==='ArrowDown'||e.key==='s')slideTimer=0;});

// Touch
let touchStartX=0,touchStartY=0,touchStartTime=0;
document.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;touchStartTime=Date.now();
});
document.addEventListener('touchend',e=>{
  if(!playing)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>30){lane=dx>0?Math.min(2,lane+1):Math.max(0,lane-1);}
  else if(dy<-40&&!jumping&&slideTimer<=0){jumping=true;playerVY=-9;}
  else if(dy>40&&!jumping){slideTimer=18;}
});

// ═══════════════ BUTTONS ═══════════════
document.getElementById('btnRetry').onclick=startGame;
document.getElementById('btnNewChar').onclick=()=>{
  document.getElementById('screenOver').classList.remove('active');
  document.getElementById('screenChar').classList.add('active');
  document.getElementById('hud').classList.remove('active');
  playing=false;
};
</script>
</body>
</html>
